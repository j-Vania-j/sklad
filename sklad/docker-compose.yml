
services:
 
  db:
    image: postgres:15  
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env  
    ports:
      - "5432:5432" 
    networks:
      - app_network

  
  web:
    build: .  
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      
      - POSTGRES_HOST=db
    depends_on:
      - db  
    networks:
      - app_network


volumes:
  postgres_data:


networks:
  app_network: